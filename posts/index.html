<body>
<header>
    <a href="https://example/" class="title">

    <nav>

            <a href="https://example/">Home</a>

            <a href="https://example/travel/">Travel</a>
            <a href="https://example/contact/">Contact</a></div>
        <button class="theme-toggle" title="Toggle Dark Mode">
            <i data-feather="moon"></i>
        </button>
    </nav>
</header>

  <main>
    <div class="section-header">
      <h1>Posts</h1>
    </div>
    <ul class="blog-posts">
      
        <li>
          <span>
            <i>
              <time datetime='2025-05-29T20:30:55+05:30' pubdate>

<footer>

    </div>
</footer>
<script>
    feather.replace();
    const themeToggle = document.querySelector('.theme-toggle');
    const currentTheme = localStorage.getItem('theme');

    // Set the initial theme based on user preference or localStorage
    if (currentTheme) {
        document.body.setAttribute('data-theme', currentTheme);
        if (currentTheme === 'dark') {
            themeToggle.innerHTML = '<i data-feather="sun"></i>';
            feather.replace();
        }
    }

    themeToggle.addEventListener('click', function() {
        let theme = 'light';
        
        // Add the transition class
        document.body.classList.add('theme-transition');

        if (document.body.getAttribute('data-theme') !== 'dark') {
            theme = 'dark';
            themeToggle.innerHTML = '<i data-feather="sun"></i>';
        } else {
            themeToggle.innerHTML = '<i data-feather="moon"></i>';
        }
        feather.replace();
        document.body.setAttribute('data-theme', theme);
        localStorage.setItem('theme', theme);

        // Remove the transition class after 0.5s
        setTimeout(() => {
            document.body.classList.remove('theme-transition');
        }, 500);
    });
</script>
</html>
